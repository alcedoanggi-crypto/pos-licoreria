{% extends "base.html" %}
{% set titulo_pagina = "Abrir caja" %}
{% block titulo %}Abrir caja · POS Licorería{% endblock %}

{% block contenido %}
<div class="panel mx-auto" style="max-width: 480px;">
  <div class="text-center mb-3">
    <i class="bi bi-unlock" style="font-size: 2.2rem; color: var(--vino-tinto);"></i>
    <h5 class="mt-2" style="color: var(--vino-tinto);">Apertura de caja</h5>
    <p class="text-muted small">Ingresa el efectivo inicial con el que arrancas el turno.</p>
  </div>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Nombre de la caja</label>
      <input type="text" name="nombre" class="form-control" value="Caja 1">
    </div>
    <div class="mb-4">
      <label class="form-label">Monto de apertura ($)</label>
      <input type="number" step="0.01" name="monto_apertura" class="form-control form-control-lg" value="0" required autofocus>
    </div>
    <button type="submit" class="btn btn-vino w-100 btn-lg"><i class="bi bi-unlock"></i> Abrir caja</button>
  </form>
</div>
{% endblock %}
