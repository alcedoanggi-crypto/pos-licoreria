{% extends "base.html" %}
{% set titulo_pagina = "Editar producto" if producto else "Nuevo producto" %}
{% block titulo %}{{ titulo_pagina }} · POS Licorería{% endblock %}

{% block contenido %}
<div class="panel" style="max-width: 760px;">
  <form method="POST">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Código de barras</label>
        <input type="text" name="codigo_barras" class="form-control" value="{{ producto.codigo_barras if producto else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">SKU</label>
        <input type="text" name="sku" class="form-control" value="{{ producto.sku if producto else '' }}" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Presentación</label>
        <input type="text" name="presentacion" class="form-control" placeholder="Botella 750ml" value="{{ producto.presentacion if producto else '' }}">
      </div>
      <div class="col-12">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" value="{{ producto.nombre if producto else '' }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Categoría</label>
        <select name="categoria_id" class="form-select">
          <option value="">-- Ninguna --</option>
          {% for c in categorias %}
          <option value="{{ c.id }}" {% if producto and producto.categoria_id == c.id %}selected{% endif %}>{{ c.nombre }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Proveedor</label>
        <select name="proveedor_id" class="form-select">
          <option value="">-- Ninguno --</option>
          {% for prov in proveedores %}
          <option value="{{ prov.id }}" {% if producto and producto.proveedor_id == prov.id %}selected{% endif %}>{{ prov.razon_social }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Precio de venta ($)</label>
        <input type="number" step="0.01" name="precio_venta" class="form-control" value="{{ producto.precio_venta if producto else 0 }}" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Costo ($)</label>
        <input type="number" step="0.01" name="costo" class="form-control" value="{{ producto.costo if producto else 0 }}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Stock actual</label>
        <input type="number" name="stock_actual" class="form-control" value="{{ producto.stock_actual if producto else 0 }}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Stock mínimo</label>
        <input type="number" name="stock_minimo" class="form-control" value="{{ producto.stock_minimo if producto else 10 }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Fecha de vencimiento (opcional)</label>
        <input type="date" name="fecha_vencimiento" class="form-control" value="{{ producto.fecha_vencimiento.isoformat() if producto and producto.fecha_vencimiento else '' }}">
      </div>
      {% if producto %}
      <div class="col-12 form-check ms-1">
        <input type="checkbox" class="form-check-input" name="activo" id="activo" {% if producto.activo %}checked{% endif %}>
        <label class="form-check-label" for="activo">Producto activo</label>
      </div>
      {% endif %}
    </div>

    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-vino"><i class="bi bi-check-lg"></i> Guardar</button>
      <a href="{{ url_for('productos.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
