{% extends "base.html" %}
{% set titulo_pagina = "Nueva orden de compra" %}
{% block titulo %}Nueva orden de compra · POS Licorería{% endblock %}

{% block contenido %}
<div class="panel" style="max-width: 920px;">
  <form method="POST">
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">Proveedor</label>
        <select name="proveedor_id" class="form-select" required>
          <option value="">Seleccionar...</option>
          {% for p in proveedores %}
          <option value="{{ p.id }}">{{ p.razon_social }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="panel-titulo">Productos a ordenar</div>
    <table class="table tabla-densa" id="tabla-lineas">
      <thead><tr><th style="width:45%">Producto</th><th>Cantidad</th><th>Costo unitario</th><th></th></tr></thead>
      <tbody>
        <tr>
          <td>
            <select name="producto_id[]" class="form-select" required>
              <option value="">Seleccionar...</option>
              {% for p in productos %}
              <option value="{{ p.id }}">{{ p.sku }} — {{ p.nombre }}</option>
              {% endfor %}
            </select>
          </td>
          <td><input type="number" min="1" name="cantidad[]" class="form-control" required></td>
          <td><input type="number" step="0.01" min="0" name="costo_unitario[]" class="form-control" required></td>
          <td><button type="button" class="btn btn-sm btn-outline-danger btn-quitar-linea"><i class="bi bi-trash"></i></button></td>
        </tr>
      </tbody>
    </table>
    <button type="button" id="btn-agregar-linea" class="btn btn-sm btn-outline-secondary mb-3">
      <i class="bi bi-plus-lg"></i> Agregar línea
    </button>

    <div class="mt-3 d-flex gap-2">
      <button type="submit" class="btn btn-vino"><i class="bi bi-check-lg"></i> Crear orden</button>
      <a href="{{ url_for('proveedores.ordenes_listar') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts_extra %}
<script>
document.getElementById("btn-agregar-linea").addEventListener("click", () => {
  const cuerpo = document.querySelector("#tabla-lineas tbody");
  const nuevaFila = cuerpo.rows[0].cloneNode(true);
  nuevaFila.querySelectorAll("select, input").forEach((campo) => (campo.value = ""));
  cuerpo.appendChild(nuevaFila);
});

document.querySelector("#tabla-lineas tbody").addEventListener("click", (evento) => {
  const boton = evento.target.closest(".btn-quitar-linea");
  if (!boton) return;
  const cuerpo = document.querySelector("#tabla-lineas tbody");
  if (cuerpo.rows.length > 1) boton.closest("tr").remove();
});
</script>
{% endblock %}
